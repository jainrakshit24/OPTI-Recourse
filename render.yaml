services:
  # Django Backend Service
  - type: web
    name: opti-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.django
    plan: free
    region: singapore # Choose the region closest to you
    port: 8000
    envVars:
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"

  # Streamlit Frontend Service
  - type: web
    name: opti-frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.streamlit
    plan: free
    region: singapore
    port: 8501
    envVars:
      - key: API_BASE_URL
        value: http://opti-backend:8000/api
      - key: STREAMLIT_SERVER_PORT
        value: "8501"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
